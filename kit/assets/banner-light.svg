    <rect x="630" y="292" width="220" height="56" rx="28" fill="#f4f6f9" stroke="#dbe1e8"/>
    <text x="740" y="326" text-anchor="middle" font-size="19" font-weight="500" fill="#0f172a" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Board reviews</text>
    <rect x="910" y="292" width="220" height="56" rx="28" fill="#f4f6f9" stroke="#dbe1e8"/>
    <text x="1020" y="326" text-anchor="middle" font-size="19" font-weight="500" fill="#0f172a" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">Ships</text>
