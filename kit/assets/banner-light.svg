    <path d="M580 320 H620" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <path d="M860 320 H900" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
    <path d="M1020 356 V392 H180 V360" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#a)"/>
    <rect x="530" y="378" width="140" height="28" fill="#ffffff"/>
    <text x="600" y="398" text-anchor="middle" font-size="16" fill="#5b6577" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">every task</text>
