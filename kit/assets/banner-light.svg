  <text x="70" y="196" font-size="34" font-weight="600" letter-spacing="-0.5" fill="#0f172a" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">AI builds. <tspan fill="#2a78d6">You steer.</tspan></text>
  <text x="70" y="236" font-size="19" fill="#5b6577" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">A human-in-the-loop kit for Claude Code: from idea to production, every decision stays yours.</text>
