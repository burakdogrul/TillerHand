<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
  <title id="t">Vibe Coding Kit</title>
  <desc id="d">Claude Code ile soru sorarak, uzman kurulu denetiminde ve profesyonel yapıda proje geliştirme kiti</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1524"/>
      <stop offset="1" stop-color="#132341"/>
    </linearGradient>
    <linearGradient id="vurgu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5598e7"/>
      <stop offset="1" stop-color="#86b6ef"/>
    </linearGradient>
    <pattern id="izgara" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#izgara)"/>

  <!-- Sol: ad ve slogan -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="72" y="118" fill="#86b6ef" font-size="20" font-weight="600" letter-spacing="3">CLAUDE CODE · GITHUB TEMPLATE</text>
    <text x="70" y="186" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="-1">Vibe Coding Kit</text>
    <text x="72" y="230" fill="#c9d6ea" font-size="22">Kararı sen verirsin. Kurul denetler. Yapı korunur.</text>
    <text x="72" y="262" fill="#8ea1bd" font-size="18">Fikirden canlıya ve bakıma: soru odaklı, kanıtlı, limit farkındalıklı geliştirme</text>
  </g>

  <!-- Sağ: akış -->
  <g font-family="'Cascadia Code', Consolas, 'SF Mono', monospace" font-size="17" font-weight="600">
    <g transform="translate(860 70)">
      <rect width="300" height="40" rx="10" fill="#1b2a40" stroke="#2f4a73"/>
      <text x="20" y="26" fill="#ffffff">/start</text>
      <text x="282" y="26" fill="#8ea1bd" text-anchor="end" font-weight="400">fikir → plan</text>
    </g>
    <g transform="translate(860 122)">
      <rect width="300" height="40" rx="10" fill="#1b2a40" stroke="#2f4a73"/>
      <text x="20" y="26" fill="#ffffff">/plan-task → /build</text>
    </g>
    <g transform="translate(860 174)">
      <rect width="300" height="40" rx="10" fill="#1b2a40" stroke="#2f4a73"/>
      <text x="20" y="26" fill="#ffffff">/findings-*</text>
      <text x="282" y="26" fill="#8ea1bd" text-anchor="end" font-weight="400">puan /100</text>
    </g>
    <g transform="translate(860 226)">
      <rect width="300" height="40" rx="10" fill="url(#vurgu)"/>
      <text x="20" y="26" fill="#0d1524">/release</text>
      <text x="282" y="26" fill="#0d1524" text-anchor="end" font-weight="400">canlı</text>
    </g>
    <path d="M1010 110v12M1010 162v12M1010 214v12" stroke="#5598e7" stroke-width="2"/>
  </g>
</svg>
