# Runs on every push and PR. The build (EAS) is not done here; it is done on EAS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs only read the repo; a hijacked step must not be able to write to the repo with the token
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npm run --if-present test
      - name: SDK compatibility
        run: npx expo-doctor
      - name: Dependency vulnerabilities (high and above)
        run: npm audit --audit-level=high --omit=dev

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Folder structure (.claude/structure.json)
        run: node .claude/hooks/structure-guard.mjs --check

  complexity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to compare with the base commit
      - name: Complexity budget (changed files; function complexity 15, function 80, file 400 lines)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .claude/hooks/budget.mjs --check --base "$BASE"

  # RLS adversarial test: an empty local Supabase starts inside CI and the migrations are applied. No secrets needed; it does not touch dev or prod.
  # If Supabase is not used (no supabase/config.toml), the steps are skipped.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('supabase/config.toml') != ''
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('supabase/config.toml') != ''
        run: npm ci
      - name: Local Supabase
        if: hashFiles('supabase/config.toml') != ''
        run: npx -y supabase@2.120.0 start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor,postgres-meta
      - name: RLS adversarial test (anonymous and second user)
        if: hashFiles('supabase/config.toml') != ''
        run: |
          # Only the needed keys are taken; the output is not run as a shell command
          keys=$(npx -y supabase@2.120.0 status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL|PUBLISHABLE_KEY|SECRET_KEY)=')
          while IFS="=" read -r name value; do value="${value%\"}"; export "$name=${value#\"}"; done <<< "$keys"
          node --test tests/security/rls.mjs

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Static security analysis (high severity findings stop CI)
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error

  duplicate-code:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Duplicate code ratio (threshold 5%)
        run: npx --yes jscpd@4 --threshold 5 --silent --ignore "**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.venv/**,**/coverage/**,**/.expo/**" .

  secret-scan:
    runs-on: ubuntu-latest
    # gitleaks reads the commit list on a PR (pulls/{n}/commits); in a private repo this gives 403 without this permission
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history is scanned
      # Free on a personal account; an organization repo needs the GITLEAKS_LICENSE secret
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only: PR comments are off, a leak turns the job red
          GITLEAKS_ENABLE_COMMENTS: "false"
