# Setup (once): uvx pre-commit install
# Update versions: uvx pre-commit autoupdate
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: secret-scan
        name: Secret scan
        entry: node .claude/hooks/guard-secrets.mjs --staged
        language: system
        pass_filenames: false
