# Runs on every push and PR. If it is red, do not merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs only read the repo; a hijacked step must not be able to write to the repo with the token
permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (no floating v10 tag)
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - name: Dependency vulnerabilities
        run: uv run --with pip-audit pip-audit
      - name: Does the Docker image build
        if: hashFiles('Dockerfile') != ''
        run: docker build -t app-ci .

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Folder structure (.claude/structure.json)
        run: node .claude/hooks/structure-guard.mjs --check

  karmasiklik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to compare with the base commit
      - name: Complexity budget (changed files; function complexity 15, function 80, file 400 lines)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .claude/hooks/budget.mjs --check --base "$BASE"

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Static security analysis (high severity findings stop CI)
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error

  kopya-kod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Duplicate code ratio (threshold 5%)
        run: npx --yes jscpd@4 --threshold 5 --silent --ignore "**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.venv/**,**/coverage/**,**/.expo/**" .

  sir-taramasi:
    runs-on: ubuntu-latest
    # gitleaks reads the commit list on a PR (pulls/{n}/commits); in a private repo this gives 403 without this permission
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history is scanned
      # Free on a personal account; an organization repo needs the GITLEAKS_LICENSE secret
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The token is read-only: PR comments are off, a leak turns the job red
          GITLEAKS_ENABLE_COMMENTS: "false"
