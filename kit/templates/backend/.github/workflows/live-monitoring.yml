# Canlıda sentetik izleme: /health ve kritik uçları 3 saatte bir CANLI ortamda dener.
# Neden 3 saat: GitHub Free özel depoda ayda 2.000 Actions dakikası var; saatlik koşu ~2.160 dk eder (docs.github.com, 2026-10-25).
# /health yanıtı LIVE_MAX_SECONDS (Variables, varsayılan 2) saniyeyi aşarsa da alarm verir.
# Bozulursa "live-monitoring" etiketli bir issue açar (zaten açıksa yenisini açmaz).
# Etkinleştirmek için:
#   1. Settings > Variables > LIVE_URL = https://api.alanadin.com
#   2. Kritik uç testleri (veri silmeyen, test hesabıyla sınırlı): tests/live/ altına pytest olarak
#   3. Gerekirse Settings > Secrets > LIVE_TEST_TOKEN (prod'da yetkisi kısıtlı test hesabı)
name: Canlı izleme

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  izle:
    if: vars.LIVE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Sağlık ve yanıt süresi
        run: |
          t=$(curl -fsS -o /dev/null --max-time 10 -w '%{time_total}' "$LIVE_URL/health")
          echo "/health: ${t} sn (sınır ${MAX} sn)"
          awk -v t="$t" -v max="$MAX" 'BEGIN { exit (t > max) }'
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          MAX: ${{ vars.LIVE_MAX_SECONDS || '2' }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2 (no floating v10 tag)
        if: hashFiles('tests/live/**') != ''
      - name: Kritik uçlar (canlı)
        if: hashFiles('tests/live/**') != ''
        # pytest exit 5 = no test collected (only __init__.py or fixtures yet): not an alarm
        run: |
          uv sync --locked
          uv run pytest tests/live -q || [ $? -eq 5 ]
        env:
          BASE_URL: ${{ vars.LIVE_URL }}
          LIVE_TEST_TOKEN: ${{ secrets.LIVE_TEST_TOKEN }}
      - name: Bozulduysa issue aç
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --label live-monitoring --state open --json number -q '.[].number')" ]; then
            gh label create live-monitoring --color D03B3B --force
            gh issue create --label live-monitoring --title "Canlı izleme: API bozuk" \
              --body "Çalışma kaydı: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
