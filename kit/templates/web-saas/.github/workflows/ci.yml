# Her push ve PR'da çalışır. Kırmızıysa merge etme.
# GitHub > Settings > Branches > main için "Require status checks" ile zorunlu kıl.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# İşler depoyu sadece okur; ele geçirilen bir adım token ile depoya yazamasın
permissions:
  contents: read

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run --if-present test
      - run: npm run build
        env:
          # Build sırasında okunan herkese açık değişkenler (gerçek sırlar burada olmaz)
          NEXT_PUBLIC_SITE_URL: https://example.com
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Bağımlılık açıkları (yüksek ve üstü)
        run: npm audit --audit-level=high --omit=dev

  # Kritik akışlar için e2e. Playwright testleri yazılınca yorumu kaldır.
  # e2e:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-node@v7
  #       with: { node-version: 22, cache: npm }
  #     - run: npm ci
  #     - run: npx playwright install --with-deps chromium
  #     - run: npx playwright test

  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Klasör yapısı (.claude/structure.json)
        run: node .claude/hooks/structure-guard.mjs --check

  karmasiklik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # base commit'iyle karşılaştırmak için
      - name: Karmaşıklık bütçesi (değişen dosyalar; fonksiyon karmaşıklığı 15, fonksiyon 80, dosya 400 satır)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .claude/hooks/budget.mjs --check --base "$BASE"

  # RLS saldırgan testi: CI içinde boş bir yerel Supabase açılır, migration'lar uygulanır. Sır gerekmez; dev ve prod'a dokunmaz.
  # Supabase kullanılmıyorsa (supabase/config.toml yoksa) adımlar atlanır.
  rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        if: hashFiles('supabase/config.toml') != ''
        with:
          node-version: 22
          cache: npm
      - if: hashFiles('supabase/config.toml') != ''
        run: npm ci
      - name: Yerel Supabase
        if: hashFiles('supabase/config.toml') != ''
        run: npx -y supabase@2.120.0 start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,supavisor,postgres-meta
      - name: RLS saldırgan testi (anonim ve ikinci kullanıcı)
        if: hashFiles('supabase/config.toml') != ''
        run: |
          # Sadece gereken anahtarlar alınır; çıktı kabuk komutu olarak çalıştırılmaz
          anahtarlar=$(npx -y supabase@2.120.0 status -o env | grep -E '^(API_URL|ANON_KEY|SERVICE_ROLE_KEY|DB_URL|PUBLISHABLE_KEY|SECRET_KEY)=')
          while IFS="=" read -r ad deger; do deger="${deger%\"}"; export "$ad=${deger#\"}"; done <<< "$anahtarlar"
          node --test tests/security/rls.mjs

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Statik güvenlik analizi (yüksek önemli bulgular CI'ı durdurur)
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error

  kopya-kod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Kopya kod oranı (eşik %5)
        run: npx --yes jscpd@4 --threshold 5 --silent --ignore "**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.venv/**,**/coverage/**,**/.expo/**" .

  sir-taramasi:
    runs-on: ubuntu-latest
    # gitleaks PR'da commit listesini okur (pulls/{n}/commits); özel depoda bu izin olmadan 403
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tüm geçmiş taranır
      # Kişisel hesapta ücretsiz; organizasyon deposunda GITLEAKS_LICENSE sırrı gerekir
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token salt okunur: PR yorumu kapalı, sızıntı işi kırmızı yapar
          GITLEAKS_ENABLE_COMMENTS: "false"
