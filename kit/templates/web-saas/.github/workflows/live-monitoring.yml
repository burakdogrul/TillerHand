# Synthetic monitoring in production: tries the critical flows (sign-up, login, main action, payment test mode) on the LIVE site every 3 hours.
# Why 3 hours: GitHub Free gives 2,000 Actions minutes a month in a private repo; an hourly run (~3 min) would cost ~2,160 min (docs.github.com, 2026-10-25).
# If something breaks it opens an issue labeled "live-monitoring" (it does not open a new one if one is already open).
# To enable:
#   1. Settings > Variables > LIVE_URL = https://example.com
#   2. Create a separate test account with restricted rights in prod: Settings > Secrets > LIVE_TEST_EMAIL, LIVE_TEST_PASSWORD
#   3. Write the tests under tests/live/*.spec.ts (flows that delete no data, limited to the test account). smoke.spec.ts comes ready:
#      does the home page open, is it within LIVE_MAX_MS (Variables, default 3000), are there errors in the console.
name: Live monitoring

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    if: vars.LIVE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Critical flows (live)
        run: npx playwright test tests/live --reporter=line
        env:
          BASE_URL: ${{ vars.LIVE_URL }}
          LIVE_MAX_MS: ${{ vars.LIVE_MAX_MS || '3000' }}
          LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
          LIVE_TEST_PASSWORD: ${{ secrets.LIVE_TEST_PASSWORD }}
      - name: Open an issue if broken
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --label live-monitoring --state open --json number -q '.[].number')" ]; then
            gh label create live-monitoring --color D03B3B --force
            gh issue create --label live-monitoring --title "Live monitoring: critical flow is broken" \
              --body "Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
