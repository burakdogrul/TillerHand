# Canlıda sentetik izleme: Kritik akışları (kayıt, giriş, ana eylem, ödeme test modu) saatte bir CANLI sitede dener.
# Bozulursa "live-monitoring" etiketli bir issue açar (zaten açıksa yenisini açmaz).
# Etkinleştirmek için:
#   1. Settings > Variables > LIVE_URL = https://alanadin.com
#   2. Prod'da yetkisi kısıtlı ayrı bir test hesabı aç: Settings > Secrets > LIVE_TEST_EMAIL, LIVE_TEST_PASSWORD
#   3. Testleri tests/live/*.spec.ts altına yaz (veri silmeyen, test hesabıyla sınırlı akışlar)
name: Canlı izleme

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  izle:
    if: vars.LIVE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Kritik akışlar (canlı)
        run: npx playwright test tests/live --reporter=line
        env:
          BASE_URL: ${{ vars.LIVE_URL }}
          LIVE_TEST_EMAIL: ${{ secrets.LIVE_TEST_EMAIL }}
          LIVE_TEST_PASSWORD: ${{ secrets.LIVE_TEST_PASSWORD }}
      - name: Bozulduysa issue aç
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --label live-monitoring --state open --json number -q '.[].number')" ]; then
            gh label create live-monitoring --color D03B3B --force
            gh issue create --label live-monitoring --title "Canlı izleme: kritik akış bozuk" \
              --body "Çalışma kaydı: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
