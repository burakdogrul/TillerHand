# Dependency updates arrive as a weekly PR; merge if CI is green.
# For security updates: GitHub > Settings > Code security > Dependabot security updates: On.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-updates:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"] # majors are done with /maintain quarterly, planned
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
