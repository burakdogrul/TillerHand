# Payment notification signature adversarial test (tr add-on). Runs with fake keys; no secret needed.
# If red, do not merge: a fake or altered payment notification may be accepted.
name: payment-webhook

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Node 22.18+ runs a .ts module directly; no dependency install needed
      - run: node --test tests/security/payment-webhook.mjs
