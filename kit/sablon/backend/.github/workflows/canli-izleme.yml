# Canlıda sentetik izleme: /health ve kritik uçları saatte bir CANLI ortamda dener.
# Bozulursa "canli-izleme" etiketli bir issue açar (zaten açıksa yenisini açmaz).
# Etkinleştirmek için:
#   1. Settings > Variables > CANLI_URL = https://api.alanadin.com
#   2. Kritik uç testleri (veri silmeyen, test hesabıyla sınırlı): tests/canli/ altına pytest olarak
#   3. Gerekirse Settings > Secrets > CANLI_TEST_TOKEN (prod'da yetkisi kısıtlı test hesabı)
name: Canlı izleme

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  izle:
    if: vars.CANLI_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sağlık
        run: curl -fsS --max-time 10 "${{ vars.CANLI_URL }}/health"
      - uses: astral-sh/setup-uv@v5
        if: hashFiles('tests/canli/**') != ''
      - name: Kritik uçlar (canlı)
        if: hashFiles('tests/canli/**') != ''
        run: uv sync --locked && uv run pytest tests/canli -q
        env:
          BASE_URL: ${{ vars.CANLI_URL }}
          CANLI_TEST_TOKEN: ${{ secrets.CANLI_TEST_TOKEN }}
      - name: Bozulduysa issue aç
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh issue list --label canli-izleme --state open --json number -q '.[].number')" ]; then
            gh label create canli-izleme --color D03B3B --force
            gh issue create --label canli-izleme --title "Canlı izleme: API bozuk" \
              --body "Çalışma kaydı: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
