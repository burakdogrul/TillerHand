# Her push ve PR'da çalışır. Kırmızıysa merge etme.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENV: test
      DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run pytest
      - name: Bağımlılık açıkları
        run: uv run --with pip-audit pip-audit
      - name: Docker imajı derleniyor mu
        if: hashFiles('Dockerfile') != ''
        run: docker build -t app-ci .

  semgrep:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Statik güvenlik analizi (yüksek önemli bulgular CI'ı durdurur)
        run: semgrep scan --config p/default --config p/owasp-top-ten --severity ERROR --error

  kopya-kod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kopya kod oranı (eşik %5)
        run: npx --yes jscpd@4 --threshold 5 --silent --ignore "**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/.venv/**,**/coverage/**,**/.expo/**" .

  sir-taramasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tüm geçmiş taranır
      # Kişisel hesapta ücretsiz; organizasyon deposunda GITLEAKS_LICENSE sırrı gerekir
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
