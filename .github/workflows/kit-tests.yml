# The kit's own tests. Runs only in the kit repo; `kit.mjs install` does not copy this file into a project.
name: Kit tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # A job-level if: cannot use hashFiles() (GitHub reports "No jobs were run"); no condition is needed,
    # kit.mjs install does not copy this file into a project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests
        run: node --test "kit/tests/*.test.mjs"
      - name: YAML validation
        run: |
          for f in kit/templates/*/.github/workflows/*.yml kit/templates/addons/*/types/*/.github/workflows/*.yml kit/templates/*/.github/dependabot.yml .github/workflows/*.yml; do
            npx --yes yaml@2.5.1 valid < "$f" || { echo "Invalid YAML: $f"; exit 1; }
          done
