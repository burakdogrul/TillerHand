# Kitin npm paketini (tillerhand) yayınlar: v* tag'i push edilince. Projelere kopyalanmaz (kit/kit.mjs → KIT_ONLY).
# Token yok: npm Trusted Publishing (OIDC). npmjs.com → tillerhand → Settings → Trusted Publisher: GitHub Actions,
# burakdogrul / TillerHand / npm-publish.yml / environment: npm. Kaynak: docs.npmjs.com/trusted-publishers (2026-10-06).
# Action'lar commit SHA'sına sabit (checkout v7.0.1, setup-node v7.1.0); yeni sürüme geçerken SHA'yı github.com/actions/<ad>/releases'tan al.
name: npm-publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Repo kodu (testler) yayın yetkisi olmadan koşar
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no cache in a release workflow (cache poisoning)
      - name: Tag main'deki bir commit'i mi gösteriyor
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "Tag main dalında değil, yayın durdu."; exit 1; }
      - name: Sürümler aynı mı (tag, package.json, kit/VERSION)
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          kit=$(cat kit/VERSION)
          echo "tag=$tag package.json=$pkg kit/VERSION=$kit"
          [ "$tag" = "$pkg" ] && [ "$tag" = "$kit" ] || { echo "Sürümler farklı, yayın durdu."; exit 1; }
      - run: node --test "kit/tests/*.test.mjs"

  # Sadece yayın: repo kodu çalıştırmaz, OIDC yetkisi yalnız burada
  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false # no cache in a release workflow (cache poisoning)
          registry-url: https://registry.npmjs.org
      - name: npm sürümü (Trusted Publishing 11.5.1+ ister)
        run: node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$(npm --version)"
      # İlk yayını hesap sahibi elle yapar (2FA ile); bu sürüm zaten yayındaysa (elle yayınlandıysa) tekrar denenmez.
      # Sadece 404 "yok" sayılır; ağ veya sunucu hatası koşuyu durdurur.
      - name: Yayınlanacak mı
        id: check
        run: |
          v=$(node -p "require('./package.json').version")
          if out=$(npm view "tillerhand@$v" version 2>&1); then
            echo "::notice::tillerhand@$v zaten yayında; atlandı."
          elif echo "$out" | grep -q E404; then
            if npm view tillerhand name >/dev/null 2>&1; then echo "go=1" >> "$GITHUB_OUTPUT"
            else echo "::warning::tillerhand npm'de yok; ilk yayın elle yapılır, bu koşu atlandı."; fi
          else
            echo "$out"; exit 1
          fi
      - if: steps.check.outputs.go == '1'
        run: npm publish --access public --provenance
